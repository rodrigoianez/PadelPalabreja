<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Peña</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0F1A">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peña">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>try{const t=localStorage.getItem("liguilla-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=Oleo+Script:wght@400;700&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: court-blue scoreboard header, tabs, one centred column (max 760px) of cards */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --ink:#0F1D2B; --muted:#5A6B7B; --line:#DCE3EA;
  --court:#1F5FA8; --court-ink:#FFFFFF; --ball:#D9E54C; --ball-ink:#1C2410;
  --win:#23804F; --loss:#C2453D; --soft:#E8EEF5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B141D; --surface:#13202C; --ink:#E6EEF5; --muted:#8FA2B3; --line:#24384A;
  --court:#1B4F8C; --court-ink:#FFFFFF; --ball:#D9E54C; --ball-ink:#1C2410;
  --win:#4CC386; --loss:#F07A70; --soft:#1A2B3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B141D; --surface:#13202C; --ink:#E6EEF5; --muted:#8FA2B3; --line:#24384A;
  --court:#1B4F8C; --court-ink:#FFFFFF; --ball:#D9E54C; --ball-ink:#1C2410;
  --win:#4CC386; --loss:#F07A70; --soft:#1A2B3A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--court);color:var(--court-ink);position:relative;overflow:hidden}
/* Fondo: pista de pádel vista desde arriba (perímetro, red, líneas de saque y central con sus dos T) */
header.band .court{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.court *{fill:none;stroke:rgba(255,255,255,.55);stroke-width:3;vector-effect:non-scaling-stroke}
.court .glass{stroke:rgba(190,225,255,.35);stroke-width:12}
.court .mesh{stroke:rgba(255,255,255,.3);stroke-width:6;stroke-dasharray:2 4}
.court .net-sh{stroke:rgba(0,0,0,.22);stroke-width:12}
.court .net{stroke:rgba(255,255,255,.9);stroke-width:4}
header .wrap{padding-block:0;position:relative;z-index:1}
header.band nav.tabs{margin-top:8px}
.courtbox{position:relative;height:clamp(120px,24vw,190px)}
.ball,.ball-sh{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;will-change:transform;transform:translate(-50px,-50px)}
.ball{background:var(--ball);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18),0 0 6px rgba(217,229,76,.5)}
.ball-sh{background:rgba(0,0,0,.3);filter:blur(1px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1;margin:6px 0 14px;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
.next{display:inline-flex;gap:8px;align-items:center;background:var(--ball);color:var(--ball-ink);border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px}
nav.tabs{display:flex;gap:4px;margin-top:22px}
nav.tabs a{color:var(--court-ink);text-decoration:none;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;padding:8px 14px 10px;border-radius:8px 8px 0 0;opacity:.8}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink);opacity:1}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
main .wrap{padding-block:22px 48px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.note{color:var(--muted);font-size:13px;margin:0}
.status{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:560px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.name,th.name{text-align:left}
td.name{font-weight:600}
tr:last-child td{border-bottom:0}
td.pos{font-family:var(--display);font-weight:800;font-size:20px;width:40px}
tr.lead td.pos{color:var(--court)}
td.pts{font-family:var(--display);font-weight:800;font-size:22px}
.form{display:inline-flex;gap:3px}
.form i{display:inline-block;width:18px;height:18px;border-radius:4px;font-style:normal;font-size:11px;font-weight:700;line-height:18px;color:#fff}
.form i.w{background:var(--win)} .form i.l{background:var(--loss)}
.form i.e{background:var(--soft);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.rules{padding:16px 18px}
.rules h3,.week h3{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.rules ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;max-width:65ch}
.vuelta{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 0 -6px}
.week{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.week.current{border-color:var(--court);box-shadow:0 0 0 1px var(--court)}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.date{color:var(--muted);font-size:13px;font-weight:500}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px}
.chip.now{background:var(--ball);color:var(--ball-ink)} .chip.done{background:var(--soft);color:var(--muted)}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.team{font-weight:600;min-width:0;overflow-wrap:anywhere}
.team.b{text-align:right}
.team.won{color:var(--win)}
.team small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.score{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em}
.score i{font-style:normal;margin:0 4px;color:var(--muted)}
.score.empty{color:var(--muted);font-family:var(--body);font-size:12px;font-weight:500}
.actions{grid-column:1/-1;display:flex;justify-content:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;font-weight:600;font-size:13px}
button.primary{background:var(--court);color:var(--court-ink);border-color:var(--court)}
button.link{border:0;background:none;color:var(--court);padding:4px 6px}
:root[data-theme="dark"] button.link{color:var(--ball)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.link{color:var(--ball)}}
.editor{grid-column:1/-1;background:var(--soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sets{display:grid;grid-template-columns:auto repeat(3,minmax(0,64px));gap:6px 8px;align-items:center;font-size:13px}
.sets .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:center}
.sets .tn{font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{text-align:center;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--loss);font-size:13px;margin:0}
.settings{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.settings+.settings{margin-top:14px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;max-width:260px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 6px;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.skips{display:flex;flex-wrap:wrap;gap:6px}
.skips span{background:var(--soft);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;display:inline-flex;align-items:center;gap:2px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}
  .match{gap:8px}.team{font-size:14px;line-height:1.35}
  .score{font-size:16px;min-width:44px}.score span{display:block}.score i{display:none}
  .sets .tn{max-width:96px}.week{padding:12px}}
@media (prefers-reduced-motion:no-preference){.week,.card{transition:box-shadow .2s}}
/* Amistosos y pestañas */
.team .guest{display:inline;font-size:11px;font-weight:500;color:var(--muted)}
.pair{display:flex;flex-direction:column;gap:6px}
.actions{gap:8px}
nav.tabs{overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;white-space:nowrap}
.tabs svg{vertical-align:-3px}
/* Estadísticas */
:root{--hl:#1F5FA8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:#D9E54C}}
:root[data-theme="dark"]{--hl:#D9E54C}
.tabs .short{display:none}
.sh{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 -8px}
.pick select{width:auto;min-width:180px;font-weight:600;font-size:16px;padding:8px 10px}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted)}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.kv{margin:0;padding:4px 16px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.kv.rec div{display:block}
.kv.rec dd{text-align:left}
table.mini{min-width:0}
table.mini td,table.mini th{padding:8px 6px}
table.mini small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.chart{padding:12px 8px 6px;position:relative}
.chart svg{display:block;max-width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .ln{cursor:pointer}
.chart .ln polyline{fill:none;stroke:var(--muted);stroke-width:2;opacity:.3;stroke-linejoin:round;stroke-linecap:round}
.chart .ln circle{fill:var(--muted);opacity:.45;stroke:var(--surface);stroke-width:2}
.chart .ln .lb{fill:var(--muted);font-size:12px;font-family:var(--body)}
.chart .ln:hover polyline{opacity:.7}
.chart .ln.on polyline{stroke:var(--hl);opacity:1;stroke-width:2.5}
.chart .ln.on circle{fill:var(--hl);opacity:1}
.chart .ln.on .lb{fill:var(--ink);font-weight:700}
.chart .ln circle.hit{fill:transparent;stroke:none;opacity:1}
.chart circle.hit{fill:transparent;stroke:none}
.pick.h2h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick.h2h select{min-width:140px;flex:1 1 140px;max-width:240px}
.pick.h2h span{color:var(--muted);font-weight:600}
.pick.h2h .me{font-size:16px;padding:8px 12px;border-radius:8px;background:var(--soft)}
.allm{padding:0}
.allm summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style-position:inside}
.allm summary span{color:var(--muted);font-weight:500}
.allm[open] summary{border-bottom:1px solid var(--line)}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.h2hlist{padding:2px 14px}
.h2hlist>div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.h2hlist>div:last-child{border-bottom:0}
.h2hlist small{display:block;color:var(--muted);font-size:12px}
.h2hlist b{font-variant-numeric:tabular-nums;white-space:nowrap}
.h2hlist .form{flex:none;margin-top:1px}
.h2hlist .form i{text-align:center}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));z-index:2}
@media (max-width:480px){nav.tabs{gap:2px}nav.tabs a{font-size:15px;padding:8px 8px 10px}.tabs .full{display:none}.tabs .short{display:inline}
  .stats4{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:24px}}

/* Selector de sección: franja neutra común a la liga y al juego */
:root{--strip:#0A0F1A; --strip-ink:#C9D1DE}
.switch{background:var(--strip);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.switch nav{max-width:760px;margin:0 auto;display:flex;gap:6px}
.switch a{flex:1;text-align:center;text-decoration:none;color:var(--strip-ink);font-weight:600;font-size:13px;padding:7px 10px;border-radius:999px;border:1px solid rgba(201,209,222,.25)}
.switch a.on-liga{background:#D9E54C;color:#1C2410;border-color:#D9E54C}
.switch a.on-pj{background:#C8324B;color:#FFFFFF;border-color:#C8324B}
.switch a:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}

/* ===== La Palabreja: identidad propia, noche granaína (solo oscuro, a propósito) ===== */
/* Layout: barra fina arriba, tablero centrado que llena el alto, teclado pegado abajo; ayuda, números y diccionario en ventanas */
body.mode-pj{
  --bg:#121829; --surface:#1C2440; --raise:#2A3358; --ink:#F2ECE1; --muted:#9AA3BF; --rule:#2A3358;
  --granada:#C8324B; --granada-ink:#FFFFFF; --albero:#E2AC4C; --albero-ink:#2A1C05; --absent:#3A4366;
  --pjdisplay:"Oleo Script",Georgia,serif; --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  background-image:repeating-conic-gradient(from 45deg,rgba(226,172,76,.03) 0 25%,transparent 0 50%);background-size:56px 56px}
.pj{min-height:calc(100dvh - 50px);display:flex;flex-direction:column}
.pj .bar{border-bottom:1px solid var(--rule);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:6px}
.pj .bar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.pj .bar-in .l{display:flex;gap:4px}
.pj .bar-in .r{display:flex;gap:4px;justify-content:flex-end}
.pj .wordmark{font-family:var(--pjdisplay);font-weight:700;font-size:28px;line-height:1.1;margin:0;color:var(--ink);text-transform:none;letter-spacing:0}
.pj .wordmark span{color:var(--granada)}
.pj .ib{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;padding:0}
.pj .ib:hover{background:var(--surface)}
.pj .ib svg{width:22px;height:22px}
.pj .play{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:12px;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:14px 10px;position:relative}
.pj .num{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--albero);font-weight:700}
.pj .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pj .board{--n:5;--gaps:4;--ts:min(60px,8dvh,calc((100vw - 24px - var(--gaps) * 5px) / var(--n)));display:grid;gap:6px;max-width:100%}
.pj .grow{display:flex;gap:5px;justify-content:center}
.pj .gap{width:calc(var(--ts) * .5);flex:none}
.pj .tile{width:var(--ts);height:var(--ts);flex:none;border-radius:4px;border:2px solid var(--raise);display:grid;place-items:center;font-weight:800;font-size:calc(var(--ts) * .5);color:var(--ink);background:transparent}
.pj .reveal-word{word-break:break-word}
.pj .tile.filled{border-color:var(--muted)}
.pj .tile.c,.pj .kb button.c{background:var(--granada);border-color:var(--granada);color:var(--granada-ink)}
.pj .tile.p,.pj .kb button.p{background:var(--albero);border-color:var(--albero);color:var(--albero-ink)}
.pj .tile.a,.pj .kb button.a{background:var(--absent);border-color:var(--absent);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .pj .tile.reveal{animation:flip .45s ease both}
  @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  .pj .tile.pop{animation:pop .1s ease}
  @keyframes pop{50%{transform:scale(1.08)}}
  .pj .grow.shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
}
.pj .toast{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;z-index:5;white-space:nowrap}
.pj .kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:520px}
.pj .krow{display:flex;gap:5px}
.pj .kb button{flex:1;min-width:0;height:54px;padding:0;font:inherit;font-weight:700;font-size:15px;border-radius:6px;border:0;background:var(--raise);color:var(--ink);cursor:pointer}
.pj .kb button.wide{flex:1.6;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.pj .again{font-size:14px;color:var(--muted);text-align:center}
.pj .again button{font:inherit;font-weight:700;color:var(--albero);background:none;border:0;cursor:pointer;padding:4px}
.pj button:focus-visible{outline:2px solid var(--albero);outline-offset:2px}
/* Ventanas */
.pj .modal{position:fixed;inset:0;z-index:20;background:rgba(6,9,18,.72);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
.pj .sheet{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:420px;max-height:100%;overflow-y:auto;padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.pj .sheet h2{font-family:var(--pjdisplay);font-weight:400;font-size:26px;margin:0;text-transform:none;letter-spacing:0;padding-right:40px}
.pj .sheet .x{position:absolute;top:10px;right:10px}
.pj .sheet p{margin:0;font-size:14px;color:var(--muted)}
.pj .ex{display:flex;gap:4px}
.pj .ex{--ts:36px}
.pj .rule{border:0;border-top:1px solid var(--rule);margin:0;width:100%}
.pj .result{display:flex;flex-direction:column;gap:4px;text-align:center}
.pj .result .t{font-family:var(--pjdisplay);font-size:30px}
.pj .reveal-word{font-weight:800;font-size:30px;letter-spacing:.14em;color:var(--albero)}
.pj .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.pj .stats b{display:block;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pj .stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pj .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.pj .dist{display:grid;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.pj .dist div{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:center}
.pj .dist i{display:block;background:var(--absent);border-radius:3px;padding:1px 8px;text-align:right;font-style:normal;font-weight:700;min-width:26px}
.pj .dist i.hl{background:var(--granada);color:var(--granada-ink)}
.pj .foot{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.pj .cd b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.pj .btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 20px;background:var(--granada);color:var(--granada-ink);cursor:pointer}
.pj .gloss{display:grid;gap:12px;margin:0}
.pj .gloss dt{font-weight:800;letter-spacing:.1em}
.pj .gloss dd{margin:2px 0 0;color:var(--muted);font-size:14px}
.pj .testbar{width:100%;max-width:520px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--albero);border-radius:10px;padding:8px 10px}
.pj .tb-l{font-size:12px;font-weight:700;color:var(--albero);text-transform:uppercase;letter-spacing:.06em}
.pj .testbar select{flex:1;min-width:140px;width:auto;font:inherit;font-size:14px;background:var(--raise);color:var(--ink);border:0;border-radius:8px;padding:7px 8px}
.pj .testbar button{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:8px;padding:7px 12px;background:var(--raise);color:var(--ink);cursor:pointer}
.pj .addform{display:flex;flex-direction:column;gap:10px}
.pj .addform label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pj .addform input,.pj .addform textarea{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);background:var(--raise);border:1px solid transparent;border-radius:8px;padding:9px 10px;width:100%;resize:vertical}
.pj .addform input{text-transform:uppercase}
.pj .addform input:focus,.pj .addform textarea:focus{outline:none;border-color:var(--albero)}
.pj .addform .btn{align-self:flex-start}
.pj .err{color:#FF8A8A}
.pj .ok{color:var(--albero)}
.pj .mine{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pj .mine li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-size:14px}
.pj .mine small{display:block;color:var(--muted)}
.pj .lnk{font:inherit;font-size:13px;font-weight:700;color:var(--albero);background:none;border:0;padding:2px 4px;cursor:pointer;flex:none}
.pj details summary{cursor:pointer}
@media (max-height:640px){.pj .kb button{height:46px}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ================== CONFIGURACIÓN ==================
// 1) Pega aquí la configuración de tu proyecto de Firebase (Configuración del proyecto > Tus apps > Web).
// 2) Cambia el PIN por el que quieras. Pásaselo a tus amigos: hace falta para apuntar resultados y cambiar ajustes de la liga.
//    Las palabras de La Palabreja se pueden añadir sin PIN.
const CONFIG={
  firebase:{
    apiKey:"AIzaSyCUlZzmkinIELkPx352sKUblYaJduFKY5E",
    authDomain:"paginapadel.firebaseapp.com",
    projectId:"paginapadel",
    storageBucket:"paginapadel.firebasestorage.app",
    messagingSenderId:"272182313407",
    appId:"1:272182313407:web:bf646f51ffd433b4d4a10a"
  },
  pin:"1234"
};
// ===================================================

(()=>{
const configured=!!CONFIG.firebase.apiKey&&!CONFIG.firebase.apiKey.startsWith("PEGA")&&!!window.firebase;
const PINK="liguilla-pin-ok";
let unlocked=false; try{ unlocked=localStorage.getItem(PINK)===String(CONFIG.pin); }catch(e){}
function askPin(){
  if(unlocked) return true;
  const p=window.prompt("Escribe el PIN del grupo para guardar:");
  if(p===null) return false;
  if(p.trim()===String(CONFIG.pin)){ unlocked=true; try{ localStorage.setItem(PINK,String(CONFIG.pin)); }catch(e){} return true; }
  window.alert("PIN incorrecto.");
  return false;
}
const noPin=()=>Promise.reject({code:"pin",message:"Falta el PIN"});
const mapErr=e=>{ throw {code:e&&e.code==="permission-denied"?"invalid_argument":"unavailable",message:String(e&&e.message||e)}; };

// Copia local por si Firebase no está configurado: los datos se quedan en este navegador
function localDb(){
  const K="liguilla-db"; let data; try{ data=JSON.parse(localStorage.getItem(K))||{}; }catch(e){ data={}; }
  const subs=new Set(), meta={fromCache:false,hasPendingWrites:false};
  const save=()=>{ try{ localStorage.setItem(K,JSON.stringify(data)); }catch(e){} subs.forEach(f=>f()); };
  const snap=(id,v)=>({id,exists:v!==undefined,data:()=>v,metadata:meta});
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const watch=f=>{ subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); };
  const docRef=path=>{ const id=path.slice(path.lastIndexOf("/")+1); return {id,path,
    get:async()=>snap(id,data[path]),
    set:async v=>{ data[path]=JSON.parse(JSON.stringify(v)); save(); },
    update:async v=>{ if(!data[path]) throw {code:"invalid_argument"}; data[path]={...data[path],...JSON.parse(JSON.stringify(v))}; save(); },
    delete:async()=>{ delete data[path]; save(); },
    onSnapshot:next=>watch(()=>next(snap(id,data[path])))}; };
  const col=c=>({path:c,doc:id=>docRef(c+"/"+(id||newId())),
    add:async v=>{ const r=docRef(c+"/"+newId()); await r.set(v); return r; },
    onSnapshot:next=>watch(()=>{ const depth=c.split("/").length+1;
      const docs=Object.keys(data).filter(k=>k.startsWith(c+"/")&&k.split("/").length===depth).sort().map(k=>snap(k.slice(c.length+1),data[k]));
      next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta}); })});
  return {doc:docRef,collection:col};
}

let base;
if(configured){ firebase.initializeApp(CONFIG.firebase); base=firebase.firestore(); }
else { base=localDb(); console.warn("Firebase sin configurar: los datos se guardan solo en este navegador."); }

// Las escrituras de la liga piden el PIN (una vez por dispositivo); las palabras de La Palabreja no
const FREE=["palabras"];
const wrapDoc=(r,free)=>{ const ok=()=>free||askPin(); return {id:r.id,path:r.path,get:()=>r.get(),onSnapshot:(n,e)=>r.onSnapshot(n,e),
  set:v=>ok()?Promise.resolve(r.set(v)).catch(mapErr):noPin(),
  update:v=>ok()?Promise.resolve(r.update(v)).catch(mapErr):noPin(),
  delete:()=>ok()?Promise.resolve(r.delete()).catch(mapErr):noPin()}; };
const db={doc:p=>wrapDoc(base.doc(p),FREE.includes(p.split("/")[0])),collection:c=>{ const col=base.collection(c), free=FREE.includes(c); return {path:c,
  doc:id=>wrapDoc(id?col.doc(id):col.doc(),free),
  add:v=>(free||askPin())?Promise.resolve(col.add(v)).then(r=>wrapDoc(r,free)).catch(mapErr):noPin(),
  onSnapshot:(n,e)=>col.onSnapshot(n,e)}; }};

let uid; try{ uid=localStorage.getItem("liguilla-uid"); if(!uid){ uid="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem("liguilla-uid",uid); } }catch(e){ uid="anon"; }
const user={id:async()=>uid,can:async()=>true,canEdit:async()=>unlocked,isOwner:async()=>unlocked};
const api={db,user};
window.claude={use:async n=>api[n]||null};
})();
</script>
<script>
// Torneo "whist" para 8: en cada vuelta cada jugador juega 1 vez con cada compañero y 2 veces contra cada rival.
const ROUNDS=[
  [[[0,1],[2,3]],[[4,5],[6,7]]],
  [[[0,2],[4,6]],[[1,3],[5,7]]],
  [[[0,3],[4,7]],[[1,2],[5,6]]],
  [[[0,4],[1,5]],[[2,6],[3,7]]],
  [[[0,5],[2,7]],[[1,4],[3,6]]],
  [[[0,6],[3,5]],[[1,7],[2,4]]],
  [[[0,7],[1,6]],[[2,5],[3,4]]]
];
const ORDERS=[[0,1,2,3,4,5,6],[3,0,4,1,5,2,6],[5,3,1,6,4,2,0]];
const DEFAULT_CFG={name:"Liguilla de los Miércoles",players:["Jugador 1","Jugador 2","Jugador 3","Jugador 4","Jugador 5","Jugador 6","Jugador 7","Jugador 8"],start:"2026-11-11",vueltas:2,skips:[]};

let cfg={...DEFAULT_CFG}, results={}, db=null, canWrite=null, readOnly=false, loaded=false, loadNote="", editing=null, editErr="";

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pname=i=>(cfg.players&&cfg.players[i])||("Jugador "+(i+1));
const tname=t=>pname(t[0])+" y "+pname(t[1]);
const fmt=d=>d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"});
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function schedule(){
  const out=[]; const skips=new Set(cfg.skips||[]);
  let d=new Date((cfg.start||DEFAULT_CFG.start)+"T12:00:00");
  while(d.getDay()!==3) d.setDate(d.getDate()+1);
  let n=1;
  const v=Math.min(3,Math.max(1,cfg.vueltas||2));
  for(let k=0;k<v;k++) for(const r of ORDERS[k]){
    while(skips.has(iso(d))) d.setDate(d.getDate()+7);
    out.push({n,vuelta:k+1,date:new Date(d),matches:ROUNDS[r].map((m,i)=>({id:"j"+n+"p"+(i+1),a:m[0],b:m[1]}))});
    d.setDate(d.getDate()+7); n++;
  }
  return out;
}

// Devuelve {sa,sb,ga,gb,winner:"a"|"b"} o null si el resultado no está completo
function evalSets(sets){
  if(!Array.isArray(sets)) return null;
  let sa=0,sb=0,ga=0,gb=0;
  for(const s of sets){ if(!s||s.length!==2) continue; const [x,y]=s.map(Number);
    if(!Number.isFinite(x)||!Number.isFinite(y)||x===y) continue;
    ga+=x; gb+=y; x>y?sa++:sb++; }
  if(sa===sb) return null;
  return {sa,sb,ga,gb,winner:sa>sb?"a":"b"};
}

function standings(weeks){
  const st=[...Array(8)].map((_,i)=>({i,pj:0,pg:0,pp:0,sf:0,sc:0,jf:0,jc:0,pts:0,form:[]}));
  for(const w of weeks) for(const m of w.matches){
    const r=results[m.id]; const e=r&&evalSets(r.sets); if(!e) continue;
    // 2-0: 3 pts ganador, 0 perdedor · 2-1: 2 pts ganador, 1 perdedor
    const tight=Math.min(e.sa,e.sb)>0;
    const side=(t,mine,their,won)=>t.forEach(p=>{const s=st[p];s.pj++;won?s.pg++:s.pp++;s.pts+=won?(tight?2:3):(tight?1:0);s.sf+=mine[0];s.sc+=their[0];s.jf+=mine[1];s.jc+=their[1];s.form.push(won?"w":"l")});
    side(m.a,[e.sa,e.ga],[e.sb,e.gb],e.winner==="a");
    side(m.b,[e.sb,e.gb],[e.sa,e.ga],e.winner==="b");
  }
  st.forEach(s=>{s.pct=s.pj?s.pg/s.pj:0});
  return st.sort((x,y)=>y.pts-x.pts||y.pct-x.pct||(y.sf-y.sc)-(x.sf-x.sc)||(y.jf-y.jc)-(x.jf-x.jc)||y.jf-x.jf||pname(x.i).localeCompare(pname(y.i)));
}

function currentWeek(weeks){
  return weeks.find(w=>w.matches.some(m=>!(results[m.id]&&evalSets(results[m.id].sets))))||null;
}

function route(){ const h=location.hash.slice(1); return ["clasificacion","jornadas","amistosos","estadisticas","ajustes"].includes(h)?h:"clasificacion"; }


function render(){
  const pj=location.hash==="#palabreja"||location.hash==="#palabreja-prueba";
  document.body.classList.toggle("mode-pj",pj);
  document.querySelector("header.band").hidden=pj; document.querySelector("main").hidden=pj;
  document.getElementById("pj").hidden=!pj;
  document.getElementById("sw-liga").className=pj?"":"on-liga"; document.getElementById("sw-pj").className=pj?"on-pj":"";
  document.getElementById("sw-liga").setAttribute("aria-current",pj?"false":"page"); document.getElementById("sw-pj").setAttribute("aria-current",pj?"page":"false");
  if(pj) return;
  const weeks=schedule(); const cur=currentWeek(weeks);
  document.getElementById("title").textContent=cfg.name||DEFAULT_CFG.name;
  const v=route();
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v?"page":"false"));
  document.getElementById("tab-ajustes").hidden=false; // el tema lo puede cambiar cualquiera; la liga solo quien puede editar
  const status=!db&&loaded?'<p class="status">Los resultados no se pueden cargar aquí. Se muestra el calendario sin resultados.</p>'
    :!loaded?'<p class="status">'+(loadNote||"Cargando resultados…")+'</p>':"";
  const view=document.getElementById("view");
  if(v==="jornadas") view.innerHTML=status+renderWeeks(weeks,cur);
  else if(v==="amistosos") view.innerHTML=status+renderAmistosos();
  else if(v==="estadisticas") view.innerHTML=status+renderStats(weeks);
  else if(v==="ajustes") view.innerHTML=status+renderSettings();
  else view.innerHTML=status+renderTable(weeks);
}

function renderTable(weeks){
  const st=standings(weeks); const played=st.some(s=>s.pj);
  const rows=st.map((s,k)=>{
    const f=s.form.slice(-5); while(f.length<5) f.unshift("e");
    return `<tr class="${k===0&&played?"lead":""}"><td class="pos">${k+1}</td><td class="name">${esc(pname(s.i))}</td>
      <td>${s.pj}</td><td>${s.pg}</td><td>${s.pp}</td><td>${s.sf-s.sc>0?"+":""}${s.sf-s.sc}</td><td>${s.jf-s.jc>0?"+":""}${s.jf-s.jc}</td>
      <td><span class="form">${f.map(x=>`<i class="${x}">${x==="w"?"V":x==="l"?"D":""}</i>`).join("")}</span></td><td class="pts">${s.pts}</td></tr>`}).join("");
  return `<div class="row" style="justify-content:space-between"><h2>Clasificación</h2></div>
  ${played?"":'<p class="note">Aún no hay partidos jugados. La tabla se rellena sola en cuanto se apunte el primer resultado en Jornadas.</p>'}
  <div class="card tablebox"><table><thead><tr><th>#</th><th class="name">Jugador</th><th>PJ</th><th>PG</th><th>PP</th><th>Sets</th><th>Juegos</th><th>Últimos 5</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="legend"><span>PJ jugados · PG ganados · PP perdidos</span><span>Sets y Juegos: diferencia a favor/en contra</span><span>Ganar 2-0 = 3 pts · Ganar 2-1 = 2 pts · Perder 1-2 = 1 pt · Perder 0-2 = 0 pts</span></div>
`;
}

// ===== Estadísticas: todo sale de los sets y juegos de cada partido =====
let statP=0; try{ statP=Number(localStorage.getItem("liguilla-statp"))||0; }catch(e){}

// Partidos de liga y amistosos, en orden de fecha. En los amistosos los invitados quedan como null
// (no tienen estadísticas propias, pero el partido cuenta para los de la peña que lo jugaron).
function playedMatches(weeks){
  const out=[], clean=sets=>sets.filter(s=>s&&s.length===2&&Number(s[0])!==Number(s[1])).map(s=>s.map(Number));
  for(const w of weeks) for(const m of w.matches){ const r=results[m.id]; const e=r&&evalSets(r.sets);
    if(e) out.push({w,m,e,date:iso(w.date),sets:clean(r.sets)}); }
  const num=v=>amiIsGuest(v)?null:Number(v.slice(1));
  for(const x of amistosos){ const e=evalSets(x.sets);
    if(e) out.push({ami:x,m:{a:x.a.map(num),b:x.b.map(num)},e,date:x.date,sets:clean(x.sets)}); }
  return out.sort((p,q)=>p.date.localeCompare(q.date));
}

function playerStats(list){
  const ps=[...Array(8)].map((_,i)=>({i,pj:0,pg:0,sf:0,sc:0,jf:0,jc:0,three:{w:0,l:0},comeback:0,blown:0,tb:{w:0,l:0},rosco:{d:0,r:0},streak:0,best:0,run:[],mate:{},riv:{}}));
  for(const {m,e,sets} of list) for(const side of ["a","b"]){
    const t=m[side], o=m[side==="a"?"b":"a"], won=e.winner===side, me=side==="a"?0:1;
    const sf=me?e.sb:e.sa, sc=me?e.sa:e.sb, jf=me?e.gb:e.ga, jc=me?e.ga:e.gb;
    const firstWon=sets[0][me]>sets[0][1-me];
    t.forEach((p,k)=>{ if(p===null) return; const s=ps[p];
      s.pj++; if(won) s.pg++; s.sf+=sf; s.sc+=sc; s.jf+=jf; s.jc+=jc;
      if(sets.length===3) won?s.three.w++:s.three.l++;
      if(won&&!firstWon) s.comeback++;
      if(!won&&firstWon) s.blown++;
      for(const st of sets){ const a=st[me], b=st[1-me];
        if(Math.max(a,b)===7&&Math.min(a,b)===6) a>b?s.tb.w++:s.tb.l++;
        if(a===6&&b===0) s.rosco.d++;
        if(a===0&&b===6) s.rosco.r++; }
      s.run.push(won);
      const add=(map,q)=>{ if(q===null) return; const x=map[q]||(map[q]={pj:0,pg:0,jd:0}); x.pj++; if(won) x.pg++; x.jd+=jf-jc; };
      add(s.mate,t[1-k]); o.forEach(q=>add(s.riv,q));
    });
  }
  ps.forEach(s=>{ let c=0; for(const w of s.run){ c=w?c+1:0; s.best=Math.max(s.best,c); }
    // racha actual: positiva si viene ganando, negativa si viene perdiendo
    const last=s.run[s.run.length-1]; let n=0; for(let k=s.run.length-1;k>=0&&s.run[k]===last;k--) n++;
    s.streak=s.run.length?(last?n:-n):0; });
  return ps;
}

// Posición de cada jugador después de cada jornada (hasta la última con algún resultado)
function rankHistory(weeks){
  let last=-1; weeks.forEach((w,k)=>{ if(w.matches.some(m=>results[m.id]&&evalSets(results[m.id].sets))) last=k; });
  const hist=[];
  for(let k=0;k<=last;k++){ const pos={}; standings(weeks.slice(0,k+1)).forEach((s,r)=>{ pos[s.i]={pos:r+1,pts:s.pts}; }); hist.push({n:weeks[k].n,pos}); }
  return hist;
}

function bumpChart(hist,sel){
  const W=Math.max(300,Math.min(726,(document.getElementById("view").clientWidth||700)-18));
  const L=30,R=92,T=10,B=28,rowH=26,H=T+B+rowH*7;
  const n=hist.length, x=k=>n===1?L+(W-L-R)/2:L+k*(W-L-R)/(n-1), y=p=>T+(p-1)*rowH;
  const short=s=>s.length>11?s.slice(0,10)+"…":s;
  let g="";
  for(let p=1;p<=8;p++) g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(p)}" y2="${y(p)}"/><text class="ax" x="${L-10}" y="${y(p)}" dy=".35em" text-anchor="end">${p}º</text>`;
  const every=Math.ceil(n/Math.max(1,Math.floor((W-L-R)/34)));
  hist.forEach((h,k)=>{ if(k%every===0||k===n-1) g+=`<text class="ax" x="${x(k)}" y="${H-6}" text-anchor="middle">J${h.n}</text>`; });
  for(const i of [...Array(8).keys()].filter(i=>i!==sel).concat(sel)){
    const on=i===sel, pts=hist.map((h,k)=>[x(k),y(h.pos[i].pos)]);
    g+=`<g class="ln${on?" on":""}" data-statp="${i}">`;
    if(n>1) g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    pts.forEach(([px,py],k)=>{ const h=hist[k].pos[i];
      g+=`<circle cx="${px}" cy="${py}" r="${on?4.5:3}"/><circle class="hit" cx="${px}" cy="${py}" r="12" data-tip="${esc(pname(i))} · J${hist[k].n}: ${h.pos}º, ${h.pts} pts"/>`; });
    const lp=pts[n-1]; g+=`<text class="lb" x="${lp[0]+10}" y="${lp[1]}" dy=".35em">${esc(short(pname(i)))}</text></g>`;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Posición de cada jugador en la clasificación después de cada jornada">${g}</svg>`;
}

function renderStats(weeks){
  const list=playedMatches(weeks);
  let html='<h2>Estadísticas</h2>';
  if(!list.length) return html+'<p class="note">Aún no hay partidos jugados. Las estadísticas aparecen en cuanto se apunte el primer resultado en Jornadas o Amistosos.</p>';
  const nAmi=list.filter(x=>x.ami).length;
  if(nAmi) html+=`<p class="note">Incluye ${nAmi} amistoso${nAmi>1?"s":""}. La clasificación solo cuenta los partidos de liga.</p>`;
  const ps=playerStats(list), s=ps[statP]||ps[0], hist=rankHistory(weeks);
  const pct=(a,b)=>b?Math.round(100*a/b)+"%":"—", sg=n=>(n>0?"+":"")+n, wl=x=>x.w+"-"+x.l;
  const opts=[...Array(8).keys()].map(i=>`<option value="${i}"${i===s.i?" selected":""}>${esc(pname(i))}</option>`).join("");
  html+=`<div class="pick"><select id="statp" aria-label="Jugador">${opts}</select></div>`;
  html+=s.pj?`<div class="stats4">
    <div class="card stat"><span class="k">Partidos</span><b>${s.pg}-${s.pj-s.pg}</b><span>ganados-perdidos</span></div>
    <div class="card stat"><span class="k">Victorias</span><b>${pct(s.pg,s.pj)}</b><span>de ${s.pj} partidos</span></div>
    <div class="card stat"><span class="k">Juegos</span><b>${pct(s.jf,s.jf+s.jc)}</b><span>${s.jf} ganados, ${s.jc} perdidos</span></div>
    <div class="card stat"><span class="k">Racha</span><b>${s.streak>0?s.streak+" V":-s.streak+" D"}</b><span>${s.streak>0?"victorias seguidas":"derrotas seguidas"}</span></div></div>
  <dl class="card kv">
    <div><dt>Sets ganados-perdidos</dt><dd>${s.sf}-${s.sc}</dd></div>
    <div><dt>Partidos a 3 sets</dt><dd>${wl(s.three)}</dd></div>
    <div><dt>Remontadas (gana tras perder el 1.er set)</dt><dd>${s.comeback}</dd></div>
    <div><dt>Ventajas perdidas (pierde tras ganar el 1.er set)</dt><dd>${s.blown}</dd></div>
    <div><dt>Sets ganados en tie-break (7-6)</dt><dd>${wl(s.tb)}</dd></div>
    <div><dt>Roscos 6-0 dados / recibidos</dt><dd>${s.rosco.d} / ${s.rosco.r}</dd></div>
    <div><dt>Mejor racha de victorias</dt><dd>${s.best}</dd></div>
  </dl>
  <div class="card tablebox"><table class="mini"><thead><tr><th class="name">Frente a…</th><th>Con él</th><th>Contra él</th></tr></thead><tbody>${
    [...Array(8).keys()].filter(q=>q!==s.i).map(q=>{ const c=x=>x?`${x.pg}-${x.pj-x.pg}<small>${sg(x.jd)} juegos</small>`:"·";
      return `<tr><td class="name">${esc(pname(q))}</td><td>${c(s.mate[q])}</td><td>${c(s.riv[q])}</td></tr>`; }).join("")}</tbody></table></div>
  <p class="note">Partidos ganados-perdidos y, debajo, diferencia de juegos.</p>`
  :'<p class="note">'+esc(pname(s.i))+' aún no ha jugado ningún partido.</p>';

  if(s.pj){ const mine=list.filter(x=>sideOf(x,s.i)).reverse();
    html+=`<details class="card allm" id="allm"${allOpen?" open":""}><summary>Todos los partidos de ${esc(pname(s.i))} <span>(${mine.length})</span></summary>
      <div class="h2hlist">${mine.map(x=>matchRow(x,s.i)).join("")}</div></details>`; }

  if(hist.length) html+=`<h3 class="sh">Clasificación jornada a jornada</h3><p class="note">Solo partidos de liga. Toca una línea o un nombre para resaltar a ese jugador.</p>
  <div class="card chart">${bumpChart(hist,s.i)}<div class="tip" hidden></div></div>`;

  html+=renderH2H(list,s.i);

  const desc=x=>(x.ami?"Amistoso · "+esc(x.ami.a.map(amiName).join(" y ")):`J${x.w.n} · ${esc(tname(x.m.a))}`)
    +` ${x.sets.map(t=>t.join("-")).join(" / ")} `+esc(x.ami?x.ami.b.map(amiName).join(" y "):tname(x.m.b));
  const diff=x=>Math.abs(x.e.ga-x.e.gb), games=x=>x.e.ga+x.e.gb;
  const by=f=>list.reduce((a,b)=>f(b)>f(a)?b:a);
  const top=(f,u)=>{ const mx=Math.max(...ps.map(f)); return mx>0?ps.filter(p=>f(p)===mx).map(p=>esc(pname(p.i))).join(", ")+" ("+mx+u+")":"—"; };
  const long=by(games);
  html+=`<h3 class="sh">Récords del grupo</h3><dl class="card kv rec">
    <div><dt>Media de juegos por partido</dt><dd>${(list.reduce((a,x)=>a+games(x),0)/list.length).toFixed(1).replace(".",",")}</dd></div>
    <div><dt>Mayor paliza</dt><dd>${desc(by(diff))}</dd></div>
    <div><dt>Partido más igualado</dt><dd>${desc(by(x=>x.sets.length*100-diff(x)))}</dd></div>
    <div><dt>Partido más largo</dt><dd>${desc(long)} · ${games(long)} juegos</dd></div>
    <div><dt>Mejor racha de victorias</dt><dd>${top(p=>p.best," seguidas")}</dd></div>
    <div><dt>Más remontadas</dt><dd>${top(p=>p.comeback,"")}</dd></div>
    <div><dt>Más tie-breaks ganados</dt><dd>${top(p=>p.tb.w,"")}</dd></div>
    <div><dt>Más roscos dados</dt><dd>${top(p=>p.rosco.d,"")}</dd></div>
  </dl>`;
  return html;
}

// Etiqueta corta de un partido (liga o amistoso) y nombres de cada pareja
const shortDate=d=>d.toLocaleDateString("es-ES",{day:"numeric",month:"short"});
const matchDate=x=>x.ami?new Date(x.date+"T12:00:00"):x.w.date;
const matchLabel=x=>(x.ami?"Amistoso":"J"+x.w.n)+" · "+shortDate(matchDate(x));
const sideNames=(x,side)=>x.ami?x.ami[side].map(amiName).join(" y "):tname(x.m[side]);
const sideOf=(x,p)=>x.m.a.includes(p)?"a":x.m.b.includes(p)?"b":null;

// Una fila de partido, con V o D desde el punto de vista del jugador p
function matchRow(x,p,extra){ const sa=sideOf(x,p), won=x.e.winner===sa;
  return `<div><span class="form"><i class="${won?"w":"l"}">${won?"V":"D"}</i></span><span><small>${esc(matchLabel(x))}${extra?" · "+extra:""}</small>
    ${esc(sideNames(x,"a"))} <b>${x.sets.map(t=>t.join("-")).join(" / ")}</b> ${esc(sideNames(x,"b"))}</span></div>`; }
let allOpen=false;
document.addEventListener("toggle",ev=>{ if(ev.target.id==="allm") allOpen=ev.target.open; },true);

// Cara a cara: el jugador elegido arriba (izquierda) frente a otro (derecha), como pareja y como rivales
let statQ=-1; try{ const v=localStorage.getItem("liguilla-statq"); if(v!==null) statQ=Number(v); }catch(e){}
function renderH2H(list,a){
  const b=statQ>=0&&statQ<8&&statQ!==a?statQ:(a===0?1:0);
  const opts=[...Array(8).keys()].filter(i=>i!==a).map(i=>`<option value="${i}"${i===b?" selected":""}>${esc(pname(i))}</option>`).join("");
  let html=`<h3 class="sh">Cara a cara</h3><div class="pick h2h"><b class="me">${esc(pname(a))}</b><span>y</span><select id="h2h-b" aria-label="Segundo jugador">${opts}</select></div>`;
  const both=list.filter(x=>sideOf(x,a)&&sideOf(x,b));
  if(!both.length) return html+`<p class="note">${esc(pname(a))} y ${esc(pname(b))} aún no han coincidido en ningún partido.</p>`;
  const z=()=>({pj:0,pg:0,sf:0,sc:0,jf:0,jc:0}), vs=z(), mate=z();
  for(const x of both){ const sa=sideOf(x,a), r=sa===sideOf(x,b)?mate:vs, me=sa==="a";
    r.pj++; if(x.e.winner===sa) r.pg++;
    r.sf+=me?x.e.sa:x.e.sb; r.sc+=me?x.e.sb:x.e.sa; r.jf+=me?x.e.ga:x.e.gb; r.jc+=me?x.e.gb:x.e.ga; }
  const na=esc(pname(a)), nb=esc(pname(b));
  const tile=(k,r,big,sub)=>`<div class="card stat"><span class="k">${k}</span>${r.pj?`<b>${big}</b><span>${sub}</span><span>Sets ${r.sf}-${r.sc} · Juegos ${r.jf}-${r.jc}</span>`:"<b>—</b><span>Aún no</span>"}</div>`;
  html+=`<div class="stats2">${tile("Juntos",mate,`${mate.pg}-${mate.pj-mate.pg}`,"ganados-perdidos")}${tile("Contra",vs,`${vs.pg}-${vs.pj-vs.pg}`,`${na} ${vs.pg} · ${nb} ${vs.pj-vs.pg}`)}</div>`;
  html+=`<div class="card h2hlist">${both.slice().reverse().map(x=>matchRow(x,a,sideOf(x,a)===sideOf(x,b)?"Juntos":"Contra")).join("")}</div>
  <p class="note">V o D desde el punto de vista de ${na}.</p>`;
  return html;
}

  const id=ev.target.id; if(id!=="statp"&&id!=="h2h-b") return;
  if(id==="h2h-b"){ statQ=Number(ev.target.value); try{ localStorage.setItem("liguilla-statq",statQ); }catch(e){} }
  else { statP=Number(ev.target.value); try{ localStorage.setItem("liguilla-statp",statP); }catch(e){} }
  const sc=window.scrollY; render(); window.scrollTo(0,sc);
});
document.addEventListener("click",ev=>{
  const g=ev.target.closest&&ev.target.closest("[data-statp]"); if(!g) return;

});
document.addEventListener("pointerover",ev=>{
  const t=ev.target.closest&&ev.target.closest("[data-tip]");
  document.querySelectorAll(".chart .tip").forEach(x=>{ if(!t||!x.parentElement.contains(t)) x.hidden=true; });
  const tip=t&&t.closest(".chart")&&t.closest(".chart").querySelector(".tip"); if(!tip) return;
  const box=tip.parentElement.getBoundingClientRect(), r=t.getBoundingClientRect();
  tip.textContent=t.dataset.tip; tip.hidden=false;
  tip.style.left=Math.min(box.width-70,Math.max(70,r.left+r.width/2-box.left))+"px"; tip.style.top=(r.top+r.height/2-box.top)+"px";
});
let resizeT; window.addEventListener("resize",()=>{ clearTimeout(resizeT); resizeT=setTimeout(()=>{ if(route()==="estadisticas") render(); },200); });

// ===== Amistosos: partidos fuera de la liga, con jugadores de la peña o invitados =====
// Cada jugador se guarda como "#3" (jugador 4 de la peña) o como el nombre del invitado
let amistosos=[], amiDraft=null, amiLoadErr=false;
const AMI_GUEST="g";
const amiIsGuest=v=>!(typeof v==="string"&&v.startsWith("#"));
const amiName=v=>amiIsGuest(v)?String(v||""):pname(Number(v.slice(1)));
const amiTeam=t=>t.map(v=>esc(amiName(v))+(amiIsGuest(v)?' <small class="guest">invitado</small>':"")).join("<br>");

function amiDraftFrom(x){
  const slot=v=>v===undefined?{sel:"",txt:""}:amiIsGuest(v)?{sel:AMI_GUEST,txt:v}:{sel:v,txt:""};
  return {id:x?x.id:null,date:x?x.date:iso(new Date()),
    slots:x?[...x.a,...x.b].map(slot):[0,1,2,3].map(()=>slot()),
    sets:[0,1,2].map(k=>x&&x.sets[k]?x.sets[k].map(String):["",""])};
}
function readAmiForm(){
  const v=id=>document.getElementById(id).value;
  return {id:amiDraft.id,date:v("am-date"),slots:[0,1,2,3].map(k=>({sel:v("am-s"+k),txt:v("am-t"+k).trim()})),sets:[0,1,2].map(k=>[v(`am-${k}-0`),v(`am-${k}-1`)])};
}

function renderAmiForm(d){
  const guests=[...new Set(amistosos.flatMap(x=>[...x.a,...x.b]).filter(amiIsGuest))].sort();
  const slot=k=>{ const s=d.slots[k];
    return `<select id="am-s${k}" data-amisel="${k}" aria-label="Jugador ${k+1}"><option value="">Elige jugador</option>${
      [...Array(8).keys()].map(i=>`<option value="#${i}"${s.sel==="#"+i?" selected":""}>${esc(pname(i))}</option>`).join("")
    }<option value="${AMI_GUEST}"${s.sel===AMI_GUEST?" selected":""}>Invitado…</option></select>
    <input id="am-t${k}" list="am-guests" maxlength="30" placeholder="Nombre del invitado" aria-label="Nombre del invitado ${k+1}" value="${esc(s.txt)}"${s.sel===AMI_GUEST?"":" hidden"}>`; };
  const cell=(k,t)=>`<input type="number" min="0" max="7" inputmode="numeric" id="am-${k}-${t}" value="${esc(d.sets[k][t])}" aria-label="Set ${k+1}">`;
  return `<section class="card settings"><h3 class="sh" style="margin:0">${d.id?"Cambiar amistoso":"Nuevo amistoso"}</h3>
    <label for="am-date">Fecha<input type="date" id="am-date" value="${esc(d.date)}" style="max-width:200px"></label>
    <div class="grid2"><div class="pair"><span class="note">Pareja 1</span>${slot(0)}${slot(1)}</div><div class="pair"><span class="note">Pareja 2</span>${slot(2)}${slot(3)}</div></div>
    <div><p class="note" style="margin-bottom:8px">Resultado (se puede dejar vacío y apuntarlo después)</p>
    <div class="sets"><span></span><span class="lbl">Set 1</span><span class="lbl">Set 2</span><span class="lbl">Set 3</span>
      <span class="tn">Pareja 1</span>${cell(0,0)}${cell(1,0)}${cell(2,0)}
      <span class="tn">Pareja 2</span>${cell(0,1)}${cell(1,1)}${cell(2,1)}</div></div>
    <datalist id="am-guests">${guests.map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
    ${editErr?`<p class="err">${esc(editErr)}</p>`:""}
    <div class="row"><button class="primary" data-amisave="1">Guardar</button><button data-amicancel="1">Cancelar</button></div></section>`;
}

function renderAmistosos(){
  const edit=canWrite!==false&&!readOnly&&db;
  let html=`<div class="row" style="justify-content:space-between"><h2>Amistosos</h2>${edit&&!amiDraft?'<button class="primary" data-aminew="1">Nuevo amistoso</button>':""}</div>
  <p class="note">Partidos fuera de la liga, por ejemplo cuando falta alguien. Pueden jugar invitados. Cuentan para las estadísticas de los jugadores de la peña, pero no para la clasificación.</p>`;
  if(amiLoadErr) html+='<p class="status">No se pueden cargar los amistosos. Revisa que las reglas de Firestore estén actualizadas.</p>';
  if(amiDraft&&!amiDraft.id) html+=renderAmiForm(amiDraft);
  if(!amistosos.length&&!amiDraft&&!amiLoadErr) html+='<p class="note">Aún no hay amistosos.</p>';
  for(const x of amistosos){
    if(amiDraft&&amiDraft.id===x.id){ html+=renderAmiForm(amiDraft); continue; }
    const e=evalSets(x.sets);
    const score=x.sets.map(s=>`<span>${Number(s[0])}-${Number(s[1])}</span>`).join("<i>/</i>");
    html+=`<section class="card week"><div class="week-head"><h3>Amistoso</h3><span class="date">${fmt(new Date(x.date+"T12:00:00"))}</span></div>
      <div class="match"><div class="team ${e&&e.winner==="a"?"won":""}">${amiTeam(x.a)}</div>
        <div class="score ${e?"":"empty"}">${e?score:"vs"}</div>
        <div class="team b ${e&&e.winner==="b"?"won":""}">${amiTeam(x.b)}</div>
        ${edit&&!amiDraft?`<div class="actions"><button class="link" data-amiedit="${x.id}">${e?"Cambiar":"Apuntar resultado"}</button><button class="link" data-amidel="${x.id}">Borrar</button></div>`:""}
      </div></section>`;
  }
  return html;
}

document.addEventListener("change",ev=>{
  const k=ev.target.dataset&&ev.target.dataset.amisel; if(k===undefined) return;
  const t=document.getElementById("am-t"+k); t.hidden=ev.target.value!==AMI_GUEST; if(!t.hidden) t.focus();
});
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.aminew){ amiDraft=amiDraftFrom(null); editing="ami"; editErr=""; render(); return; }
  if(b.dataset.amiedit){ const x=amistosos.find(a=>a.id===b.dataset.amiedit); if(!x) return; amiDraft=amiDraftFrom(x); editing="ami"; editErr=""; render(); return; }
  if(b.dataset.amicancel){ amiDraft=null; editing=null; editErr=""; render(); return; }
  if(b.dataset.amidel){ const x=amistosos.find(a=>a.id===b.dataset.amidel); if(!x) return;
    if(!confirm("¿Seguro que quieres borrar este amistoso?\n"+x.a.map(amiName).join(" y ")+" contra "+x.b.map(amiName).join(" y ")+(x.sets.length?" ("+setsText(x.sets)+")":""))) return;
    await write(()=>db.collection("amistosos").doc(x.id).delete()); render(); return; }
  if(!b.dataset.amisave) return;
  const d=readAmiForm(); amiDraft=d;
  const fail=m=>{ editErr=m; render(); };
  if(!d.date) return fail("Pon la fecha del partido.");
  const ps=[];
  for(let k=0;k<4;k++){ const s=d.slots[k];
    if(!s.sel) return fail("Falta elegir el jugador "+(k+1)+".");
    if(s.sel===AMI_GUEST){ const n=s.txt.replace(/^#+/,"").trim(); if(!n) return fail("Escribe el nombre del invitado "+(k+1)+"."); ps.push(n); }
    else ps.push(s.sel); }
  if(new Set(ps.map(v=>amiName(v).toLowerCase())).size<4) return fail("Hay un jugador repetido.");
  const sets=[];
  for(let k=0;k<3;k++){ const [a,c]=d.sets[k];
    if(a===""&&c==="") continue;
    if(a===""||c==="") return fail("Falta un número en el set "+(k+1)+".");
    if(Number(a)===Number(c)) return fail("Un set no puede acabar en empate (set "+(k+1)+").");
    sets.push([Number(a),Number(c)]); }
  if(sets.length&&!evalSets(sets)) return fail("El resultado tiene que tener un ganador: más sets ganados por una pareja.");
  // Cambiar un resultado ya apuntado pide confirmación
  const old=d.id&&amistosos.find(a=>a.id===d.id);
  if(old&&old.sets.length&&setsText(old.sets)!==setsText(sets)

// Calendario de palabras: igual para todos porque solo depende del día y de la lista compartida.
// Una palabra añadida entra en el sorteo a partir del día siguiente; una quitada deja de salir al día siguiente.
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
let sched=[], schedKey=null;
function dayWord(d){
  const key=ADDED.map(a=>a.id+":"+a.addedDay+":"+(a.deletedDay??"")).join("|");
  if(key!==schedKey||sched.length<=d){
    sched=[]; schedKey=key; const last={}; const D=Math.max(d,dayIdx()+1);
    for(let i=0;i<=D;i++){
      if(i===0){ sched.push(BASE[0]); last[BASE[0].id]=0; continue; }
      const pool=BASE.map(b=>({e:b,w:1})).concat(ADDED.filter(a=>a.addedDay<i&&(a.deletedDay==null||i<=a.deletedDay)).map(a=>({e:a,w:WEIGHT})));
      const gap=Math.min(pool.length-1,100);
      let cand=pool.filter(p=>last[p.e.id]===undefined||i-last[p.e.id]>gap); if(!cand.length) cand=pool;
      let r=rng(i*7919+17)()*cand.reduce((s,p)=>s+p.w,0), pick=cand[cand.length-1];
      for(const p of cand){ r-=p.w; if(r<0){ pick=p; break; } }
      sched.push(pick.e); last[pick.e.id]=i;
    }
  }
  return sched[d];
}

function score(g,ans){
  const n=ans.length, res=Array(n).fill("a"), left={};
  for(let i=0;i<n;i++){ if(g[i]===ans[i]) res[i]="c"; else left[ans[i]]=(left[ans[i]]||0)+1; }
  for(let i=0;i<n;i++){ if(res[i]!=="c"&&left[g[i]]){ res[i]="p"; left[g[i]]--; } }
  return res;
}
function state(){ const phrase=game.entry.phrase, ans=phrase.replace(/ /g,""); const won=game.guesses.includes(ans); return {phrase,ans,n:ans.length,won,over:won||game.guesses.length>=6}; }
function layout(phrase,cell){ let k=0, out=""; for(const ch of phrase){ out+=ch===" "?'<div class="gap"></div>':cell(k++); } return out; }

function finish(won){
  if(game.test||stats.last===game.idx) return;
  stats.played++;
  if(won){ stats.wins++; stats.dist[game.guesses.length-1]++; stats.streak=stats.last===game.idx-1?stats.streak+1:1; stats.best=Math.max(stats.best,stats.streak); }
  else stats.streak=0;
  stats.last=game.idx; store("palabreja-stats",stats);
}

function toast(t){ const el=$("pj-toast"); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},1600); }

function press(k){
  if(modal||!ready||!game) return;
  if(!game.test&&game.idx!==dayIdx()) game=freshGame();
  const st=state(); if(st.over) return;
  shake=false; revealRow=-1; popAt=-1;
  if(k==="ENTER"){
    if(game.cur.length<st.n){ toast("Faltan letras"); shake=true; }
    else {
      game.guesses.push(game.cur); game.cur=""; revealRow=game.guesses.length-1;
      const s=state();
      if(s.over){ finish(s.won); if(!s.won) toast(s.phrase); setTimeout(()=>openModal("stats"),s.won?900+s.n*60:1700); }
    }
  } else if(k==="DEL") game.cur=game.cur.slice(0,-1);
  else if(/^[A-ZÑ]$/.test(k)&&game.cur.length<st.n){ game.cur+=k; popAt=game.cur.length-1; }
  saveGame(); draw();
}

function allEntries(){ return BASE.concat(ADDED.filter(a=>a.deletedDay==null)); }
function drawTestBar(){
  let bar=$("pj-test");
  if(!isTest()){ if(bar) bar.hidden=true; return; }
  if(!bar){
    bar=document.createElement("div"); bar.id="pj-test"; bar.className="testbar";
    bar.innerHTML=`<span class="tb-l">Modo prueba · no cuenta</span><select id="pj-test-sel" aria-label="Palabra de prueba"></select><button data-testrand="1">Al azar</button>`;
    document.querySelector("#pj .play").prepend(bar);
    bar.querySelector("select").addEventListener("change",e=>{ const f=allEntries().find(x=>x.id===e.target.value); if(f){ testEntry=f; game=freshGame(); closeModal(); draw(); } });
  }
  const len=p=>p.replace(/ /g,"").length;
  const opts=allEntries().slice().sort((a,b)=>len(a.phrase)-len(b.phrase)||a.phrase.localeCompare(b.phrase));
  const sel=$("pj-test-sel"); const html=opts.map(o=>`<option value="${esc(o.id)}">${esc(o.phrase)} (${len(o.phrase)})${o.id[0]==="u"?" · añadida":""}</option>`).join("");
  if(sel.dataset.h!==html){ sel.innerHTML=html; sel.dataset.h=html; }
  sel.value=testEntry.id; bar.hidden=false;
}

function draw(){
  drawTestBar();
  if(!ready||!game){
    $("pj-num").textContent="Cargando la palabra del día…";
    $("pj-board").innerHTML=""; $("pj-kb").innerHTML=""; $("pj-again").hidden=true; return;
  }
  const s=state(), keys={}, rank={a:1,p:2,c:3};
  const words=s.phrase.split(" ").length;
  $("pj-num").textContent=(game.test?"Prueba":"Palabra nº "+(game.idx+1))+" · "+s.n+" letras"+(words>1?" · "+words+" palabras":"");
  let html="";
  for(let r=0;r<6;r++){
    const g=game.guesses[r]; let cells="";
    if(g){ const sc=score(g,s.ans); cells=layout(s.phrase,i=>`<div class="tile ${sc[i]} ${r===revealRow?"reveal":""}" style="animation-delay:${i*Math.min(90,900/s.n)}ms">${g[i]}</div>`); for(let i=0;i<s.n;i++){ if(!keys[g[i]]||rank[sc[i]]>rank[keys[g[i]]]) keys[g[i]]=sc[i]; } }
    else if(r===game.guesses.length&&!s.over){ cells=layout(s.phrase,i=>{ const ch=game.cur[i]||""; return `<div class="tile ${ch?"filled":""} ${i===popAt?"pop":""}">${ch}</div>`; }); }
    else cells=layout(s.phrase,()=>'<div class="tile"></div>');
    html+=`<div class="grow ${r===game.guesses.length&&shake?"shake":""}">${cells}</div>`;
  }
  const gaps=words-1;
  $("pj-board").style.setProperty("--n",String(s.n+gaps*0.5));
  $("pj-board").style.setProperty("--gaps",String(s.n-1+gaps));
  $("pj-board").innerHTML=html;
  $("pj-again").hidden=!s.over;
  $("pj-kb").innerHTML=["QWERTYUIOP","ASDFGHJKLÑ","ZXCVBNM"].map((row,ri)=>`<div class="krow">${ri===2?'<button class="wide" data-key="ENTER">Enviar</button>':""}${[...row].map(ch=>`<button class="${keys[ch]||""}" data-key="${ch}">${ch}</button>`).join("")}${ri===2?'<button class="wide" data-key="DEL" aria-label="Borrar">⌫</button>':""}</div>`).join("");
}

function tileRow(word,marks){ return `<div class="ex">${[...word].map((ch,i)=>`<div class="tile ${marks[i]||""}">${ch}</div>`).join("")}</div>`; }

function sheetHelp(){
  return `${X}<h2 id="pj-mtitle">Cómo se juega</h2>
  <p>Adivina la palabra granaína o andaluza del día en 6 intentos. Cada día tiene un largo distinto, y algunas son expresiones de dos o tres palabras: los huecos entre palabras ya vienen marcados y solo escribes las letras.</p>
  <p>Van sin tildes. La Ñ cuenta como letra.</p>
  ${tileRow("BULLA",["c"])}<p><b style="color:var(--ink)">B</b> está en la palabra y en su sitio.</p>
  ${tileRow("CHOTO",["","","p"])}<p><b style="color:var(--ink)">O</b> está en la palabra, pero en otro sitio.</p>
  ${tileRow("GUASA",["","","","a"])}<p><b style="color:var(--ink)">S</b> no está en la palabra.</p>
  <hr class="rule"><p>Cada día a medianoche sale una palabra nueva, la misma para todos. Con el botón + podéis añadir palabras vuestras, que salen más a menudo que las demás.</p>`;
}
function hms(){ const n=new Date(), m=new Date(n); m.setHours(24,0,0,0); let t=Math.max(0,Math.floor((m-n)/1000)); const h=Math.floor(t/3600); t%=3600; return [h,Math.floor(t/60),t%60].map(x=>String(x).padStart(2,"0")).join(":"); }
function sheetStats(){
  const s=state(), w=game.entry;
  const pct=stats.played?Math.round(stats.wins/stats.played*100):0, max=Math.max(1,...stats.dist);
  const res=s.over?`<div class="result"><span class="t">${s.won?"¡Olé!":"Esta vez no"}</span>
    <span class="reveal-word">${esc(w.phrase)}</span><p>${esc(w.def)}</p>${w.id[0]==="u"?'<p class="lbl">Palabra añadida por el grupo</p>':""}</div><hr class="rule">`:"";
  return `${X}<h2 id="pj-mtitle">${s.over?"Resultado":"Tus números"}</h2>${res}
  <div class="stats">${[[stats.played,"Jugadas"],[pct+"%","Aciertos"],[stats.streak,"Racha"],[stats.best,"Mejor racha"]].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>
  <span class="lbl">Intentos para acertar</span>
  <div class="dist">${stats.dist.map((n,i)=>`<div><span>${i+1}</span><i class="${s.won&&game.guesses.length===i+1?"hl":""}" style="width:${Math.max(8,n/max*100)}%">${n}</i></div>`).join("")}</div>
  ${s.over?`<hr class="rule"><div class="foot"><div class="cd"><span class="lbl">Próxima palabra</span><b id="pj-cd">${hms()}</b></div><button class="btn" data-share="1">Copiar resultado</button></div>`:""}`;
}
function sheetDicc(){
  const idx=dayIdx(), past=[], seen=new Set();
  for(let i=idx-1;i>=0;i--){ const w=dayWord(i); if(!seen.has(w.id)){ seen.add(w.id); past.push(w); } }
  return `${X}<h2 id="pj-mtitle">Diccionario</h2>
  ${past.length?`<p>Palabras de días anteriores y lo que significan.</p><dl class="gloss">${past.map(p=>`<div><dt>${esc(p.phrase)}</dt><dd>${esc(p.def)}</dd></div>`).join("")}</dl>`
    :'<p>Hoy es el primer día. Aquí irán apareciendo las palabras de días anteriores con su significado.</p>'}`;
}
function sheetAdd(){
  const live=ADDED.filter(a=>a.deletedDay==null), mine=live.filter(a=>me&&a.by===me);
  const row=a=>`<li><span><b>${esc(a.phrase)}</b> <small>${esc(a.def)}</small></span><button class="lnk" data-remove="${esc(a.docId)}">Quitar</button></li>`;
  const can=db&&canAdd!==false;
  return `${X}<h2 id="pj-mtitle">Añadir palabra</h2>
  <p>Añade una palabra o expresión granaína (de 1 a 3 palabras). A partir de mañana entra en el sorteo y tiene 8 veces más opciones de salir que las de la lista.</p>
  ${can?`<form id="pj-add" class="addform" novalidate>
    <label for="pj-add-w">Palabra o expresión<input id="pj-add-w" maxlength="40" autocomplete="off" placeholder="Por ejemplo: ESTAR EMPANAO"></label>
    <label for="pj-add-d">Qué significa<textarea id="pj-add-d" maxlength="200" rows="2" placeholder="Explícala como se la explicarías a un guiri"></textarea></label>
    ${addErr?`<p class="err">${esc(addErr)}</p>`:""}${addMsg?`<p class="ok">${esc(addMsg)}</p>`:""}
    <button class="btn" type="submit">Añadir</button>
  </form>`:`<p class="err">${db?"Para añadir palabras necesitas permiso de edición en esta página. Pídeselo a quien la gestiona o pásale tu palabra.":"Ahora mismo no se pueden guardar palabras desde aquí."}</p>`}
  <hr class="rule"><p>Hay ${live.length===1?"1 palabra añadida":live.length+" palabras añadidas"} por el grupo. No se enseñan para no destripar ninguna.</p>
  ${mine.length?`<span class="lbl">Las que has añadido tú</span><ul class="mine">${mine.map(row).join("")}</ul>`:""}
  ${isOwner&&live.length?`<details><summary class="lbl">Ver todas las añadidas (verás soluciones)</summary><ul class="mine">${live.map(row).join("")}</ul></details>`:""}`;
}
function openModal(which){
  if(!game&&which!=="help"&&which!=="add") return;
  modal=which; $("pj-sheet").innerHTML=which==="help"?sheetHelp():which==="dicc"?sheetDicc():which==="add"?sheetAdd():sheetStats();
  $("pj-modal").hidden=false;
  clearInterval(cdT); if(which==="stats") cdT=setInterval(()=>{ const el=$("pj-cd"); if(el) el.textContent=hms(); },1000);
  const f=which==="add"?$("pj-add-w"):null; (f||$("pj-sheet").querySelector("[data-close]"))?.focus();
}
function closeModal(){ modal=null; addMsg=""; addErr=""; $("pj-modal").hidden=true; clearInterval(cdT); }

function normPhrase(s){ return s.toUpperCase().replace(/Ñ/g,"\u0001").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"Ñ").replace(/\s+/g," ").trim(); }
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="pj-add") return; ev.preventDefault();
  const phrase=normPhrase($("pj-add-w").value), def=$("pj-add-d").value.trim(), letters=phrase.replace(/ /g,"");
  addMsg=""; addErr="";
  if(!/^[A-ZÑ]+( [A-ZÑ]+){0,2}$/.test(phrase)) addErr="Escribe solo letras, con 3 palabras como mucho.";
  else if(letters.length<3||letters.length>14) addErr="Tiene que tener entre 3 y 14 letras (sin contar espacios).";
  else if(!def) addErr="Falta explicar qué significa.";
  else if(allEntries().some(e=>e.phrase===phrase)) addErr="Esa ya está en la lista.";
  if(!addErr){
    try{ await db.collection("palabras").add({phrase,def:def.slice(0,200),by:me,addedDay:dayIdx(),createdAt:new Date().toISOString()}); addMsg="Añadida: "+phrase+". Puede salir a partir de mañana."; }
    catch(e){ addErr=e&&e.code==="pin"?"Hace falta el PIN del grupo para añadir palabras.":e&&e.code==="invalid_argument"?"No tienes permiso para añadir palabras en esta página.":e&&e.code==="quota_exceeded"?"La lista está llena. Quitad alguna antes de añadir más.":"No se ha podido guardar. Revisa la conexión y prueba otra vez."; if(e&&e.code==="invalid_argument") canAdd=false; }
  }
  const keepW=addErr?$("pj-add-w").value:"", keepD=addErr?$("pj-add-d").value:"";
  $("pj-sheet").innerHTML=sheetAdd();
  if($("pj-add-w")){ $("pj-add-w").value=keepW; $("pj-add-d").value=keepD; $("pj-add-w").focus(); }
});

document.addEventListener("click",async ev=>{
  if(ev.target.id==="pj-modal"){ closeModal(); return; }
  const b=ev.target.closest("button"); if(!b||!b.closest("#pj")) return;
  if(b.dataset.key){ press(b.dataset.key); b.blur(); return; }
  if(b.dataset.testrand){ const all=allEntries(); testEntry=all[Math.floor(Math.random()*all.length)]; game=freshGame(); draw(); b.blur(); return; }
  if(b.dataset.open){ openModal(b.dataset.open); return; }
  if(b.dataset.close){ closeModal(); return; }
  if(b.dataset.remove){
    try{ await db.collection("palabras").doc(b.dataset.remove).update({deletedDay:dayIdx()}); addMsg="Quitada. Deja de salir a partir de mañana."; addErr=""; }
    catch(e){ addErr=e&&e.code==="pin"?"Hace falta el PIN del grupo para quitarla.":"No se ha podido quitar."; }
    $("pj-sheet").innerHTML=sheetAdd(); return;
  }
  if(b.dataset.share){
    const s=state(), icon={c:"🟥",p:"🟨",a:"⬛"};
    const txt="La Palabreja nº "+(game.idx+1)+" "+(s.won?game.guesses.length:"X")+"/6\n"+game.guesses.map(g=>score(g,s.ans).map(x=>icon[x]).join("")).join("\n");
    try{ await navigator.clipboard.writeText(txt); b.textContent="¡Copiado!"; }catch(e){ b.textContent="No se ha podido copiar"; }
  }
});
document.addEventListener("keydown",ev=>{
  if(!isPj()) return;
  if(ev.key==="Escape"&&modal){ closeModal(); return; }
  if(modal||ev.ctrlKey||ev.metaKey||ev.altKey||/^(SELECT|INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  if(ev.key==="Enter"){ ev.preventDefault(); press("ENTER"); return; }
  if(ev.key==="Backspace"){ press("DEL"); return; }
  if(ev.key.length!==1) return;
  let k=ev.key.toUpperCase(); if(k!=="Ñ") k=k.normalize("NFD").replace(/[̀-ͯ]/g,"");
  if(/^[A-ZÑ]$/.test(k)) press(k);
});
const firstVisit=()=>{ if(isPj()&&!load("palabreja-help",false)){ store("palabreja-help",true); openModal("help"); } };
window.addEventListener("hashchange",()=>{ if(!isPj()) return; if(ready&&isTest()!==!!(game&&game.test)){ closeModal(); game=freshGame(); } draw(); firstVisit(); });

function start(){ ready=true; game=freshGame(); draw(); }
draw(); firstVisit();
(async()=>{
  const c=window.claude;
  db=c&&c.use?await c.use("db"):null;
  if(!db){ start(); return; }
  const user=await c.use("user");
  if(user){ try{ me=await user.id(); }catch(e){} try{ canAdd=await user.can("data.write"); }catch(e){} try{ isOwner=!!(await user.isOwner()); }catch(e){} }
  const timer=setTimeout(()=>{ if(!ready){ slow=true; start(); } },10000);
  db.collection("palabras").onSnapshot(q=>{
    ADDED=q.docs.map(d=>({id:"u"+d.id,docId:d.id,...d.data()}))
      .filter(a=>typeof a.phrase==="string"&&typeof a.def==="string"&&Number.isFinite(a.addedDay)&&/^[A-ZÑ]+( [A-ZÑ]+){0,2}$/.test(a.phrase))
      .sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
    if(q.metadata.fromCache&&!ready) return;
    clearTimeout(timer);
    if(!ready){ start(); }
    else if(slow&&game&&!game.test&&game.guesses.length===0&&game.entry.phrase!==dayWord(game.idx).phrase){ slow=false; game=freshGame(); draw(); }
    if(modal==="add"&&!$("pj-add-w")?.value) $("pj-sheet").innerHTML=sheetAdd();
    if(isTest()) drawTestBar();
  },()=>{ clearTimeout(timer); if(!ready) start(); });
})();
})();
</script>
<script>
// App instalable (PWA): solo funciona servida por https (GitHub Pages, Firebase Hosting…)
if("serviceWorker" in navigator&&location.protocol==="https:") window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });

// Bola de la cabecera: peloteo de un campo a otro, vista desde arriba.
// Cada golpe va del jugador al otro campo, bota y sube hasta el rival. La altura se ve
// porque la bola se separa de su sombra y crece un poco. Posiciones en % de la pista.
(()=>{
  const box=document.querySelector(".courtbox"), ball=document.getElementById("ball"), sh=document.getElementById("ball-sh");
  if(!box||!ball||!sh) return;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const put=(x,y,z)=>{ const W=box.clientWidth,H=box.clientHeight, px=x/100*W, py=y/100*H;
    sh.style.transform=`translate(${px}px,${py}px)`;
    ball.style.transform=`translate(${px}px,${py-z}px) scale(${1+z/70})`; };
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){ put(24,40,0); return; }
  let side=0, from={x:rnd(8,22),y:rnd(25,75)}, segs=[], t0=null;
  function shot(){ // de "from" al otro campo
    side=1-side;
    const to={x:side?rnd(76,94):rnd(6,24),y:rnd(14,86)};
    const r=Math.random();
    const type=r<.12?"globo":r<.24?"remate":r<.34?"dejada":"normal";
    // dónde bota: más cerca de la red en una dejada, más al fondo en un globo
    const depth=type==="dejada"?rnd(.12,.25):type==="globo"?rnd(.65,.8):rnd(.35,.6);
    const bx=side?50+(to.x-50)*depth+3:50-(50-to.x)*depth-3, by=from.y+(to.y-from.y)*rnd(.7,.9);
    const h=type==="globo"?rnd(30,38):type==="remate"?rnd(4,7):type==="dejada"?rnd(9,13):rnd(13,20);
    const d=type==="globo"?rnd(1300,1600):type==="remate"?rnd(380,480):type==="dejada"?rnd(800,1000):rnd(650,850);
    const bounce={x:bx,y:by}, end=type==="dejada"?{x:side?bx+rnd(6,12):bx-rnd(6,12),y:by+rnd(-6,6)}:to;
    segs.push({a:from,b:bounce,h,d},{a:bounce,b:end,h:type==="remate"?rnd(8,12):h*.35,d:d*.45});
    from=end;
  }
  function frame(now){
    requestAnimationFrame(frame);
    if(!box.offsetWidth||document.hidden){ t0=null; return; }   // cabecera oculta (Palabreja) o pestaña en segundo plano
    if(t0===null){ t0=now; }
    if(!segs.length) shot();
    while((now-t0)>=segs[0].d){ t0+=segs[0].d; segs.shift(); if(!segs.length) shot(); }
    const s=segs[0], t=(now-t0)/s.d;
    put(s.a.x+(s.b.x-s.a.x)*t, s.a.y+(s.b.y-s.a.y)*t, Math.sin(Math.PI*t)*s.h);
  }
  requestAnimationFrame(frame);
})();
</script>
